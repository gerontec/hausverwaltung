# Hausverwaltung - http://<server>/hv/  (restrict to your LAN / VPN ranges)
Alias /hv /srv/hausverwaltung/public
<Directory /srv/hausverwaltung/public>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    <RequireAny>
        Require ip 127.0.0.1 ::1 192.168.0.0/16 10.0.0.0/8 fd00::/8
    </RequireAny>
    php_admin_value upload_max_filesize 64M
    php_admin_value post_max_size 70M
</Directory>
<Directory /srv/hausverwaltung>
    Require all denied
</Directory>
